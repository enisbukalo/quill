[project]
name = "quill"
dynamic = ["version"]
description = "Code-driven LLM software-dev pipeline with a FastAPI live-observability backend"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",
    "rich>=13.0",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "sse-starlette>=2.1",
    "nvidia-ml-py>=12.0",
]
mcp = [
    "mcp>=1.27,<2",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "ty>=0.0.1a1",
    "mypy>=1.11",
]

[project.scripts]
quill = "quill.cli:main"
quill-api = "quill_api.app:run"
quill-mcp = "quill_mcp.server:main"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

# Version is derived from the latest git tag (e.g. v0.1.0 -> 0.1.0) by hatch-vcs.
# No manual bump: tag the commit and the build picks it up. See release.yml.
[tool.hatch.version]
source = "vcs"

# Before the first tag (and on shallow CI checkouts with no tags) fall back to a
# dev version instead of erroring.
[tool.hatch.version.raw-options]
fallback_version = "0.0.0"

[tool.hatch.build.targets.wheel]
packages = ["quill", "quill_api", "quill_mcp"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint.per-file-ignores]
# Built-in runners register themselves through deliberate bottom imports to avoid a circular import.
"quill/runners/__init__.py" = ["E402"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Coverage gate lives in CI flags (--cov-fail-under=80) so local runs aren't blocked.
addopts = "--cov=quill --cov=quill_api --cov=quill_mcp --cov-report=term-missing"

[tool.coverage.run]
branch = true
source = ["quill", "quill_api", "quill_mcp"]
# Entry-point glue that's exercised end-to-end (real models / a live server) rather than by
# unit tests: the CLI's wiring/finally cleanup, run_pipeline's real-deps assembly, and the
# FastAPI app factory. Their logic is covered indirectly; the omitted lines are the I/O shells.
omit = [
    "quill/cli.py",
    "quill_api/app.py",
]

[tool.coverage.report]
exclude_also = [
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "\\.\\.\\.",
]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["quill", "quill_api", "quill_mcp"]
